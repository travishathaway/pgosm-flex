[project]
name = "pgosm-flex"
version = "0.1.0"
description = "OpenStreetMap data import tool for PostgreSQL/PostGIS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.3",
    "httpx>=0.28.1",
    "osm2pgsql-tuner==0.1.0",
    "osmium>=3.4.1",
    "packaging>=23.0",
    "psycopg>=3.1",
    "psycopg-binary>=3.1",
    "sh>=1.14.2",
]

[project.scripts]
pgosm-flex = "pgosm_flex.main:run_pgosm_flex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pgosm_flex"]

[dependency-groups]
dev = [
    "coverage>=7.13.1",
]
