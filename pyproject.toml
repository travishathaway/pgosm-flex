[project]
name = "pgosm-flex"
version = "0.1.0"
description = "OpenStreetMap data import tool for PostgreSQL/PostGIS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "osmium>=3.4.1",
]

[project.scripts]
pgosm-flex = "pgosm_flex.main:run_pgosm_flex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pgosm_flex"]

[dependency-groups]
dev = [
    "coverage>=7.13.1",
    "pytest>=7.0",
    "pytest-timeout>=2.1",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests/tests", "tests/integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (requires database)",
    "slow: marks tests as slow running",
    "output: marks tests that validate SQL query output",
]
# Fail on unregistered markers
addopts = "--strict-markers -v"

[tool.pixi.workspace]
channels = ["conda-forge", "file:///Users/travishathaway/opt/conda-local-channel"]
platforms = ["osx-arm64"] # , "osx-64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
pgosm-flex = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.dependencies]
click = ">=8.1.3"
httpx = ">=0.28.1"
# osmium = ">=3.4.1"  TBD
packaging = ">=23.0"
psycopg = ">=3.1"
sh = ">=1.14.2"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
tomli = ">=2.0.1" #; python_version<'3.11'",
postgresql = ">=18"
postgis = "*"
luarocks = "*"
osmium-tool = "*"
osm2pgsql = ">=2"

[tool.pixi.feature.dev.dependencies]
coverage = ">=7.13.1"
pytest = ">=7.0"
pytest-timeout = ">=2.1"

[tool.pixi.tasks]
